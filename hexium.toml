# Hexium publishing settings for `tcli publish --config-path hexium.toml --file <zip>` (the release workflow,
# .github/workflows/release.yml). Hexium's upload API is Thunderstore's, so the same tcli uploads the same zip (built by
# `make package`; its manifest.json decides name and version).
# namespace = the Hexium team (Algo7, as on Thunderstore); CI checks namespace and name against the csproj (ModAuthor,
# AssemblyName). versionNumber isn't used with --file, but tcli requires a valid one.
[config]
schemaVersion = "0.0.1"

[package]
namespace = "Algo7"
name = "MountedArchery"
versionNumber = "1.0.0"

[build]
outdir = "./bin/thunderstore"

[publish]
repository = "https://hexium.gg"
communities = ["valheim"]

[publish.categories]
# Hexium's own list (valheim.hexium.gg/api/experimental/community/valheim/category/), not Thunderstore's.
# Mounts, Transportation, Vehicles: a riding mod, tagged like the other riding mods. Combat: shooting from the saddle.
# Valheim 1.0: the game update it is built and tested for. Open Source: MIT, source on GitHub.
# Client-side isn't a category on Hexium: it's the install location ("client"). Hexium ignores the categories sent
# with the upload, so the release workflow sets this list and the install location after it (edits on the page are
# replaced at each release).
# Hexium has no AI-generated category (its FAQ: not required); the README's disclosure line stays.
valheim = ["Mounts", "Combat", "Transportation", "Vehicles", "Valheim 1.0", "Open Source"]
