<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- MountedArchery icon: original line drawing of a bow with an arrow nocked (shoot from the saddle), glowing amber
       (#ffb347), on the round wooden shield of the author's other Valheim mod icons. Rendered to icon.png with cairosvg
       (1024 px, then LANCZOS down to 256). -->
  <defs>
    <clipPath id="wood"><circle cx="128" cy="128" r="96"/></clipPath>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="#1c2128"/>
  <circle cx="128" cy="128" r="108" fill="#808c98"/>
  <circle cx="128" cy="128" r="96" fill="#704c2e"/>
  <g clip-path="url(#wood)" stroke="#593c26" stroke-width="3">
    <path d="M 48 20 V 236 M 72 20 V 236 M 96 20 V 236 M 120 20 V 236 M 144 20 V 236 M 168 20 V 236 M 192 20 V 236 M 216 20 V 236"/>
  </g>
  <circle cx="128" cy="128" r="96" fill="url(#shade)"/>
  <g transform="translate(128 128)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="bow">
      <path d="M -22 -72 Q 50 0 -22 72"/>
      <path d="M -22 -72 L -22 72"/>
    </g>
    <use href="#bow" stroke="#ffb347" stroke-width="26" stroke-opacity="0.12"/>
    <use href="#bow" stroke="#ffb347" stroke-width="18" stroke-opacity="0.22"/>
    <use href="#bow" stroke="#ffb347" stroke-width="9"/>
  </g>
  <g transform="translate(128 128)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="arrow">
      <path d="M -62 0 H 58"/>
      <path d="M 42 -13 L 58 0 L 42 13"/>
      <path d="M -62 0 L -74 -11 M -62 0 L -74 11 M -50 0 L -62 -11 M -50 0 L -62 11"/>
    </g>
    <use href="#arrow" stroke="#ffb347" stroke-width="26" stroke-opacity="0.12"/>
    <use href="#arrow" stroke="#ffb347" stroke-width="18" stroke-opacity="0.22"/>
    <use href="#arrow" stroke="#ffb347" stroke-width="9"/>
  </g>
</svg>
